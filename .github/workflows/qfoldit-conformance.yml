name: qFoldIT Conformance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adapter repository
        uses: actions/checkout@v4
      - name: Checkout qFoldIT governance kit
        uses: actions/checkout@v4
        with:
          repository: qfoldit/.github
          path: .qfoldit-governance
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical scientific adapter manifest
        run: python .qfoldit-governance/conformance/validate.py qfoldit.adapter.json
